name: astrbot_plugin_reply_delay
display_name: 回复延时
desc: 每条要发送的回复先在 5~20 秒（可调）内随机抽一个秒数，抽到多少就延时多少秒再发，多条消息各抽各的
help: '【作用】

  机器人准备好一条回复后不立刻发，先抽一个随机秒数，等够了再发出去。

  默认区间 5~20 秒，可在插件配置里改。


  【注意】

  1. 只覆盖正常回复链路（含分段回复的每一段）。

  2. 流式输出不生效。

  3. tool 里 send_message_to_user 那种绕过当前事件直接发送的消息不生效。

  4. 想让每段之间的间隔更长，可以同时打开框架自带的「分段回复」间隔设置。

  '
version: v1.0.0
author: 洛水
