name: astrbot_plugin_group_welcome
display_name: 进群欢迎
desc: 新人进群自动发欢迎语，提醒先看群文件、群公告和群相册
help: '【说明】

  不需要指令，装好即用。有新人通过审批或被人拉进群时自动发一条欢迎。


  文案、总开关、生效范围都在插件配置里改：

  - 欢迎文案：支持 {nickname} 占位，会替换成新人群名片或昵称

  - 生效群号：留空表示所有群都欢迎，填了就只在这些群生效


  【排查】

  欢迎没出来时先看日志里有没有 [group_welcome] 开头的行；

  确认当前平台适配器是 aiocqhttp（QQ 那条线），别的平台不一定发得出 notice。

  '
version: v1.0.0
author: 洛水
