name: astrbot_plugin_session_switch
display_name: 会话开关
desc: 管理员指令，用开关某个会话的 AI，开和关都支持定时；关掉后该会话不再请求大模型、不再回复
help: '【权限】

  管理员指令。允许的人：AstrBot 配置里的 admins_id、

  本插件白名单 allowed_users（默认 3190568934）、群主。

  普通成员发这个指令只会收到一句「没权限」（想放开就把 admin_only 关掉）。


  【指令】直接在私聊或群里发：

  - /会话 关                关掉本会话（默认关到今天结束）

  - /会话 关 2h             关 2 小时，也可以 30m / 1d / 今天 / 永久

  - /会话 关 到 8:00        关到早上八点，也认 明天8点 / 8点半

  - /会话 开                打开本会话

  - /会话 开 2h             现在打开，2 小时后自动关上

  - /会话 关 群 691314843   关掉指定群

  - /会话 关 私聊 3190568934

  - /会话 关 default:GroupMessage:691314843

  - /会话 状态              看本会话是开还是关

  - /会话 列表              看所有挂着定时切换的会话

  - /会话 全开              一次性全打开

  - /会话 帮助


  【别名】

  session / 会话开关 / 开关


  【时间写法】

  2h / 30m / 1d / 90（数字默认按分钟）/ 今天 / 永久

  8:00 / 8点 / 8点半 / 明天8点 / 到8:00

  钟点写法过了点就自动算明天


  【原理】

  关掉时写 AstrBot 自带的会话级 LLM 开关

  （SessionServiceManager.set_llm_status_for_session -> False），

  面板里的会话状态也会跟着变；同时在 on_waiting_llm_request、

  on_llm_request、on_decorating_result 三个钩子上做兜底，

  关着的会话既不请求模型，也不会把内容发出去。

  设了时间的会话由插件内部每 30 秒检查一次，到点自动开 / 自动关。

  '
version: v1.2.0
author: 洛水
