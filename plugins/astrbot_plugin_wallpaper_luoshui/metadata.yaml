name: astrbot_plugin_wallpaper_luoshui
display_name: 洛水壁纸工坊
desc: 给 AstrBot WebUI 换壁纸的插件。扫描本机壁纸文件夹（支持 Wallpaper Engine 创意工坊目录）读取壁纸并预览、本地上传静态或动态壁纸（可选保留声音）、新建与切换轮换壁纸集、壁纸库关键词搜索与批量操作、调节界面字体颜色 / 遮罩透明度 / 模糊程度 / 切换过渡时长，改完立即生效；换壁纸走交叉淡化，不会硬切。插件自带 ffmpeg，没有的话也会自动装一份。
short_desc: AstrBot 面板壁纸管理器：扫描、上传、轮换、搜索、透明度、字体颜色、模糊、过渡
version: v1.0.8
author: 洛水
category: 工具
tags:
  - 壁纸
  - UI美化
  - 动态壁纸
  - WebUI
help: |
  【作用】
  把 AstrBot 面板（WebUI）的背景换成静态图或动态 mp4，并且所有参数都能在插件页面里调。

  【插件页面】
  插件详情页点「壁纸工坊」进入管理界面，里面分四块：
  1. 壁纸库：上面一条工具栏，能按关键词搜壁纸（名字、文件名、来源路径都能搜），也能切「全部／只看动态／只看静态」；
     每张卡片左下角有勾选框，勾完可以全选、全不选、反选、批量加进轮换集、批量删除；
     导入时同一个源文件只会进库一次，重复导入的会在工具栏出现「清理重复」按钮，点一下每组只留最早那张。
     删除时如果那个视频正被转码或播放占着（Windows 上删不掉），会先把它从库里摘掉、文件排进队列稍后自动重删，
     卡在队列里多少张会写在工具栏的小字上，不会像以前一样安静地失败。
     单张卡片上还有预览、应用、改名、开关声音、删除，点「应用」后面板立刻跟着换，不用手动刷新了。
  2. 来源文件夹：填 Wallpaper Engine 的 workshop 目录（例如 D:\steam\steamapps\workshop\content\431960）
     或者任意图片/视频文件夹，点扫描就能看到识别结果（每个文件都带缩略图，点图看大图）。
     扫描结果上面的工具栏一直贴在顶部：全选、全不选、只选动态、只选静态、导入时保留声音、导入选中，
     不用再滚到列表最下面去点，勾选状态在切「只看动态／只看静态」时也不会丢。
  3. 上传：本地上传静态图或 mp4，可选择是否保留声音，下面会显示 ffmpeg 状态。
  4. 轮换集：新建、改名、删除集合，把壁纸丢进集合，然后选一个作为当前轮换集。

  【外观参数】
  字体颜色、遮罩透明度、模糊程度、页面底色、轮换模式、切换间隔、是否启用视频、视频质量等，
  既可以在插件配置页改，也可以在插件页面里改，改完点保存就会重新写入面板样式。
  另外多了两项只管插件页面自己的颜色：插件页面文字颜色、插件页面次要文字颜色，
  次要色留空时会自动按主色 72% 的透明度变淡，小字不会糊成一片。
  这两项改完松手就自动保存，还会在本机留一份副本，换壁纸、重载插件都不会掉。

  【命令】
  /壁纸            查看当前壁纸状态
  /壁纸 刷新       重新应用一次（改了配置没生效时用）
  /壁纸 下一张     换一张（按当前轮换集随机）

  【注意】
  1. 插件会读取并改写 data/dist/index.html，注入的代码块用
     <!-- astrbot-wallpaper:start --> / <!-- astrbot-wallpaper:end --> 包裹，删除这两个标记之间的内容即可完全卸载。
  2. 转码需要 ffmpeg。插件包里已经内置了一份（插件目录的 bin\ffmpeg.exe），会优先用它；
     万一那份没了，就依次去 AstrBot 根目录、系统 PATH 里找；全都没有会在后台自动下一份放进插件目录，
     也能在插件页面的「上传壁纸」里点「自动安装 ffmpeg」。想手动放也行，丢进插件目录的 bin 文件夹即可。
  3. 面板样式是浏览器缓存的，改完记得 Ctrl+F5 强刷。
